
services:
  orchestrator-dev:
    build:
      context: .
      dockerfile: orchestrator/orchestrator.dev.Dockerfile
    command: python orchestrator/server.py --live-reload --port ${ORCHESTRATOR_PORT:-42069}
    ports:
      - "${ORCHESTRATOR_PORT:-42069}:${ORCHESTRATOR_PORT:-42069}"
    volumes:
      - .:/app
      - ${HOME}/.bittensor:/home/appuser/.bittensor:ro
      - ./gcs_service_account.json:/app/gcs_service_account.json:ro
    networks:
      - default
      - signoz-net
    environment:
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-42069}
      - EPISTULA_HOTKEY_PATH=/home/appuser/.bittensor/wallets/coldkey/hotkeys/hotkey
      - EPISTULA_HOTKEY_SEED_PATH=/app/secrets/hotkey.txt
      - EPISTULA_COLDKEY_SEED_PATH=/app/secrets/coldkey.txt
      - CALLBACK_GCS_BUCKET=${CALLBACK_GCS_BUCKET}
      - CALLBACK_GCS_PREFIX=${CALLBACK_GCS_PREFIX:-callbacks}
      - CALLBACK_GCS_CREDENTIALS=${CALLBACK_GCS_CREDENTIALS:-/app/gcs_service_account.json}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcs_service_account.json}
      - JOBRELAY_BASE_URL=${JOBRELAY_BASE_URL:-https://jobrelay1738.dippy-bittensor.studio}
      - JOBRELAY_TIMEOUT_SECONDS=${JOBRELAY_TIMEOUT_SECONDS:-5}
      - DATABASE_URL=${DATABASE_URL}
      - LISTEN_SYNC_BACKEND=redis
      - LISTEN_SYNC_REDIS_URL=redis://redis:6379/0
      - LISTEN_SYNC_REDIS_CHANNEL_PREFIX=listen_sync
      - LISTEN_SYNC_REDIS_TTL_SECONDS=600
      - SS58_BASE_URL=${SS58_BASE_URL:-http://ss58:8585}
      - SS58_TIMEOUT_SECONDS=${SS58_TIMEOUT_SECONDS:-5}
      - ENABLE_LOCAL_STUB_MINER=true
      - LOCAL_STUB_MINER_URL=http://stub-miner:${STUB_MINER_PORT:-8765}
      - LOCAL_STUB_MINER_HOTKEY=5EtM9iXMAYRsmt6aoQAoWNDX6yaBnjhmnEQhWKv8HpwkVtML
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=orchestrator
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,provider_name=bittensor
      - OTEL_SDK_DISABLED=true
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  forwarder:
    build:
      context: .
      dockerfile: forwarder.Dockerfile
    command: python -m forwarder.server
    ports:
      - "${FORWARDER_PORT:-9871}:${FORWARDER_PORT:-9871}"
    volumes:
      - .:/app
    environment:
      - FORWARDER_PORT=${FORWARDER_PORT:-9871}
      - FORWARDER_ORCHESTRATOR_BASE_URL=http://orchestrator-dev:${ORCHESTRATOR_PORT:-42069}
      - FORWARDER_LISTEN_AUTH_SECRET=${LISTEN_AUTH_SECRET:-orchestrator-listen-secret}
      - FORWARDER_JOB_TYPE=${FORWARDER_JOB_TYPE:-base-h100_pcie}
      - FORWARDER_TIMEOUT_SECONDS=${FORWARDER_TIMEOUT_SECONDS:-10}
    env_file:
      - .env
    depends_on:
      orchestrator-dev:
        condition: service_started

  ss58:
    build:
      context: ./ss58_service
      dockerfile: Dockerfile
    command: python -m ss58.main
    env_file:
      - .env
    ports:
      - "${SS58_PORT:-8585}:${SS58_PORT:-8585}"
    volumes:
      - ./ss58_service:/app
      - ss58_data:/var/lib/ss58
    networks:
      - default
      - signoz-net
    environment:
      - SS58_HOST=0.0.0.0
      - SS58_PORT=${SS58_PORT:-8585}
      - SS58_RELOAD=true
      - SS58_HEAD_PATH=${SS58_HEAD_PATH:-/var/lib/ss58/head.json}
      - SS58_PINATA_API_BASE=${SS58_PINATA_API_BASE:-https://api.pinata.cloud}
      - SS58_PINATA_GATEWAY_BASE=${SS58_PINATA_GATEWAY_BASE:-https://gateway.pinata.cloud/ipfs}
      - SS58_PINATA_TIMEOUT_SECONDS=${SS58_PINATA_TIMEOUT_SECONDS:-20}
      - SS58_PINATA_JWT=${SS58_PINATA_JWT}
      - SS58_PINATA_API_KEY=${SS58_PINATA_API_KEY}
      - SS58_PINATA_API_SECRET=${SS58_PINATA_API_SECRET}
      - SS58_ED25519_SEED_HEX=${SS58_ED25519_SEED_HEX}
      - SS58_REVISION=local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SS58_PORT:-8585}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  python-runner:
    build:
      context: .
      dockerfile: orchestrator/orchestrator.dev.Dockerfile
    command: sleep infinity
    volumes:
      - .:/app
      - ${HOME}/.bittensor:/home/appuser/.bittensor:ro
      - ./gcs_service_account.json:/app/gcs_service_account.json:ro
    environment:
      - EPISTULA_HOTKEY_PATH=/home/appuser/.bittensor/wallets/coldkey/hotkeys/hotkey
      - EPISTULA_HOTKEY_SEED_PATH=/app/secrets/hotkey.txt
      - EPISTULA_COLDKEY_SEED_PATH=/app/secrets/coldkey.txt
      - CALLBACK_GCS_BUCKET=${CALLBACK_GCS_BUCKET}
      - CALLBACK_GCS_PREFIX=${CALLBACK_GCS_PREFIX:-callbacks}
      - CALLBACK_GCS_CREDENTIALS=${CALLBACK_GCS_CREDENTIALS:-/app/gcs_service_account.json}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcs_service_account.json}
      - JOBRELAY_BASE_URL=${JOBRELAY_BASE_URL:-https://jobrelay1738.dippy-bittensor.studio}
      - JOBRELAY_TIMEOUT_SECONDS=${JOBRELAY_TIMEOUT_SECONDS:-5}
      - DATABASE_URL=${DATABASE_URL}
      - LISTEN_SYNC_BACKEND=redis
      - LISTEN_SYNC_REDIS_URL=redis://redis:6379/0
      - LISTEN_SYNC_REDIS_CHANNEL_PREFIX=listen_sync
      - LISTEN_SYNC_REDIS_TTL_SECONDS=600
      - SS58_BASE_URL=${SS58_BASE_URL:-http://ss58:8585}
      - SS58_TIMEOUT_SECONDS=${SS58_TIMEOUT_SECONDS:-5}
      - ENABLE_LOCAL_STUB_MINER=true
      - LOCAL_STUB_MINER_URL=http://stub-miner:${STUB_MINER_PORT:-8765}
      - LOCAL_STUB_MINER_HOTKEY=5EtM9iXMAYRsmt6aoQAoWNDX6yaBnjhmnEQhWKv8HpwkVtML
      - OTEL_SDK_DISABLED=true
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stub-miner:
    build:
      context: .
      dockerfile: orchestrator/orchestrator.dev.Dockerfile
    command: python dippy-studio-bittensor-miner/reverse_proxy/server.py
    ports:
      - "${STUB_MINER_PORT:-8765}:${STUB_MINER_PORT:-8765}"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app:/app/dippy-studio-bittensor-miner
      - REVERSE_PROXY_CONFIG_PATH=/app/dippy-studio-bittensor-miner/reverse_proxy/config.local.json
      - EMBED_STUB_MINER=true
      - REVERSE_PROXY_HOST=0.0.0.0
      - REVERSE_PROXY_PORT=${STUB_MINER_PORT:-8765}
      - INFERENCE_SERVER_URL=http://127.0.0.1:${STUB_MINER_PORT:-8765}/stub
      - STUB_MINER_IMAGE_PATH=${STUB_MINER_IMAGE_PATH:-/app/dev_scaffolding/assets/stub_miner_sample.png}
      - STUB_MINER_OVERRIDE_CALLBACK_URL=${STUB_MINER_OVERRIDE_CALLBACK_URL}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${STUB_MINER_PORT:-8765}/status"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default
      - signoz-net

  postgres:
    image: postgres:18
    ports:
      - "10069:5432"
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
  ss58_data:

networks:
  signoz-net:
    external: true
